[project]
name = "recommendation-system"
version = "0.1.0"
description = "Product-association recommendation pipeline"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fpgrowth-py==1.0.0",
    "mlxtend>=0.25,<0.26",
    "numpy>=2.5,<3",
    "pandas>=3.0,<4",
    "pyodbc>=5.3,<6",
    "python-dotenv>=1.2,<2",
    "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
]
notebook = [
    "ipykernel>=7.3,<8",
    "matplotlib>=3.11,<4",
    "scikit-learn>=1.9,<2",
]
spark = [
    "pyspark>=4.2,<5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [
    "apriori.py",
    "apriori_store.py",
    "notebooks",
]

[tool.coverage.run]
source = ["scripts"]

[tool.coverage.report]
show_missing = true
